<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="$canonical">
$alternates
<meta property="og:type" content="profile">
<meta property="og:title" content="$title">
<meta property="og:description" content="$description">
<meta property="og:url" content="$canonical">
<meta property="og:locale" content="$og_locale">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script type="application/ld+json">$jsonld</script>
</head>
<body>
<a class="skip" href="#main">$skip</a>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="$home">$name</a>
    <nav class="nav" aria-label="$nav_label">
$nav
    </nav>
    <div class="tools">
      <nav class="langs" aria-label="$lang_label">
$langs
      </nav>
      <button class="theme" type="button" data-to-dark="$theme_to_dark" data-to-light="$theme_to_light" aria-label="$theme_to_dark" title="$theme_to_dark">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z" fill="currentColor"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
$body
</main>

<footer class="foot">
  <div class="foot-in">
    <span>© $year $name</span>
    <span>$updated</span>
  </div>
</footer>
<script src="/assets/js/main.js" defer></script>
</body>
</html>
